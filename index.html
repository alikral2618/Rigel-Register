
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeynep ❤️ Mert</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars"></div>
    <div id="hearts"></div>
    <a href="galeri.html" class="gallery-button">
    🤍 GALERİMİZ
    </a>
    <main class="container">
        <p class="small-text">BİZİM HİKAYEMİZ</p>

        <h1>ZEYNEP <span>♥</span> MERT</h1>

        <p class="subtitle">
            Birlikte başlayan en güzel hikâye...
        </p>

        <div class="heart-container">
            <div class="heart">♥</div>
        </div>

        <p class="since">BİRLİKTE OLDUĞUMUZ SÜRE</p>

        <div class="counter">
            <div class="time-box">
                <strong id="days">0</strong>
                <small>GÜN</small>
            </div>

            <div class="time-box">
                <strong id="hours">00</strong>
                <small>SAAT</small>
            </div>

            <div class="time-box">
                <strong id="minutes">00</strong>
                <small>DAKİKA</small>
            </div>

            <div class="time-box">
                <strong id="seconds">00</strong>
                <small>SANİYE</small>
            </div>
        </div>

        <div class="date">
            ♥ 22 EYLÜL 2026 ♥
        </div>

        <p class="message">
            Seninle geçen her saniye,<br>
            hayatımın en güzel zamanı. 🤍
        </p>

        <footer>
            Sonsuza kadar Zeynep & Mert 🤍
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
